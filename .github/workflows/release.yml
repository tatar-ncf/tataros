name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: tar czf "tataros-${GITHUB_REF_NAME}.tar.gz" bin lib docs LICENSE NOTICE README.md
      - run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "TatarOS Linux ${GITHUB_REF_NAME}" \
            --generate-notes \
            "tataros-${GITHUB_REF_NAME}.tar.gz"
