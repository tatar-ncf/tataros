name: CI
on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -x bin/tos lib/*.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke tests
        env:
          TOS_NO_TEA: "1"
          TOS_PLAIN: "1"
        run: |
          set -e
          bash bin/tos ярдәм   >/dev/null
          bash bin/tos сүзлек  >/dev/null
          bash bin/tos версия  >/dev/null
          rc=0; bash bin/tos zzzz-unknown || rc=$?
          test "$rc" -eq 64
          out=$(TOS_TALOSCTL=/nonexistent TOS_PLAIN= AYDA_FORCE_FUN=1 bash bin/tos татарнетес-конфиг 2>&1 || true)
          echo "$out" | grep -q "kubeconfig"
          echo "◆ smoke passed"
