name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: true   # shellcheck ubuntu-latest'та инде бар
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x bin/tos lib/*.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/unit.sh

  catalog-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: catalog in sync with locale/*.po
        run: |
          cp lib/catalog.sh /tmp/committed.sh
          bash scripts/build-catalog.sh >/dev/null
          diff -u /tmp/committed.sh lib/catalog.sh || {
            echo "lib/catalog.sh stale! run scripts/build-catalog.sh"; exit 1; }

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke tests
        env:
          TOS_NO_TEA: "1"
          TOS_PLAIN: "1"
        run: |
          set -e
          bash bin/tos ярдәм   >/dev/null
          bash bin/tos сүзлек  >/dev/null
          bash bin/tos версия  >/dev/null
          rc=0; bash bin/tos zzzz-unknown || rc=$?
          test "$rc" -eq 64
          out=$(TOS_TALOSCTL=/nonexistent TOS_PLAIN= TOS_FORCE_FUN=1 bash bin/tos татарнетес-конфиг 2>&1 || true)
          echo "$out" | grep -q "kubeconfig"
          echo "◆ smoke passed"
